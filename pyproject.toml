[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyevtana"
version = "0.1.0"
description = "Object-oriented analysis layer for the Mu2e EventNtuple"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "uproot>=5",
    "awkward>=2",
    "vector>=1",
    "numpy",
]

[project.scripts]
pyevtana-describe = "pyevtana.cli:main"

[tool.setuptools.packages.find]
include = ["pyevtana*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
